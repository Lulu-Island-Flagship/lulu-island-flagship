# v8.3 E0 — CI mínimo: nada entra a main sin typecheck y tests verdes.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        timeout-minutes: 10
        run: npx tsc --noEmit
      - name: Lint
        timeout-minutes: 10
        # Fix (auditoría 2026-08-03, C3): bajado de 60 a 30. La ronda de
        # auditoría del 2026-08-02 arregló ~30 de los ~53 warnings de
        # react-hooks/exhaustive-deps, dejando ~23. Con 30 hay margen de ~7
        # para no romper el build por un warning nuevo incidental, pero
        # cualquier regresión seria (>7 warnings nuevos) SÍ rompe CI.
        # Meta: bajar a 0. Para lograrlo, correr `npm run lint` localmente,
        # anotar el conteo EXACTO, y bajar este número a ese valor. Repetir
        # hasta llegar a 0. NUNCA subir este número.
        run: npm run lint -- --max-warnings=30
      - name: Build
        timeout-minutes: 10
        run: npm run build
      - name: Tests
        timeout-minutes: 10
        run: npm test
      - name: Tokens de diseño — cero hex de marca fuera de la fuente única
        run: |
          if grep -rln -iE "#2E5C8A|#3E6D9E|#3A6E9E|#E3AAB8|#8A3A46|#1F2E3D" src/ tailwind.config.ts \
            --include="*.ts" --include="*.tsx" --include="*.css" \
            | grep -v "src/design/tokens.ts" | grep -v "src/app/tokens.css"; then
            echo "::error::Hex de marca fuera de src/design/tokens.ts (invariante E0-C5)"; exit 1
          fi
      - name: Privacidad — sin select(*) en páginas del cliente sobre quotes/orders
        run: |
          if grep -rn 'from("quotes")' src/app/\[locale\]/ -A2 | grep 'select("\*")'; then
            echo "::error::select(*) sobre quotes en página de cliente (invariante B.2.3)"; exit 1
          fi
          if grep -rn 'from("orders")' src/app/\[locale\]/ -A2 | grep 'select("\*")'; then
            echo "::error::select(*) sobre orders en página de cliente (invariante B.2.3)"; exit 1
          fi
      - name: Accesibilidad — sin regresiones de WCAG 2.1 AA en las 3 superficies (E6-C7)
        run: npm run audit:a11y
