# v5.0 — CI mínimo: nada entra a main sin typecheck, tests e invariantes verdes.
name: CI
on:
  # v5.0: push a main lo build-ea Vercel (typecheck + build + deploy).
  # GitHub Actions CI solo corre en PRs y bajo demanda (workflow_dispatch)
  # para no consumir minutos del plan gratuito en cada push.
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values para que next build no truene en CI — los tests
      # unitarios no dependen de Supabase y el build solo necesita que
      # las variables existan (no se conecta a la base durante build).
      NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0: necesario para el gate UNCLASSIFIED (git merge-base
          # y diff contra origin/main) dentro de verify:invariants.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        timeout-minutes: 10
        run: npx tsc --noEmit
      - name: Lint
        timeout-minutes: 10
        run: npm run lint
      - name: Build
        timeout-minutes: 30
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Tests
        timeout-minutes: 10
        run: npm test
      - name: Auditoría de dependencias (bloquea solo crítico)
        run: npm audit --audit-level=critical
      - name: Invariantes v5.0 (tokens, contraste, privacidad, waivers vencidos)
        timeout-minutes: 5
        run: npm run verify:invariants
      - name: Accesibilidad — sin regresiones de WCAG 2.1 AA en las 3 superficies (E6-C7)
        run: npm run audit:a11y
