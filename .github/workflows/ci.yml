# v8.3 E0 — CI mínimo: nada entra a main sin typecheck y tests verdes.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        timeout-minutes: 10
        run: npx tsc --noEmit
      - name: Lint
        timeout-minutes: 10
        # --max-warnings=60: techo temporal, ya CONFIRMADO empíricamente
        # (2026-08-02) como holgado -- el usuario corrió `npm run build &&
        # npm run lint && npm test` de punta a punta en su máquina tras la
        # ronda de auditoría que arregló 30 de los ~53 warnings de
        # react-hooks/exhaustive-deps, y la cadena completó sin que lint
        # fallara (si hubiera excedido 60, `&&` habría cortado antes de
        # llegar a `npm test`, que sí corrió). El conteo real de hoy es, por
        # lo tanto, <= 60, pero sigue sin medirse exacto (el sandbox de CI/
        # auditoría no pudo correr `eslint` completo por límite de tiempo).
        # Sigue siendo deuda: DEBE bajarse a un número exacto medido (o a 0)
        # la próxima vez que alguien corra lint localmente y anote el
        # conteo real. No subir este número; solo bajarlo.
        run: npm run lint -- --max-warnings=60
      - name: Build
        timeout-minutes: 10
        run: npm run build
      - name: Tests
        timeout-minutes: 10
        run: npm test
      - name: Tokens de diseño — cero hex de marca fuera de la fuente única
        run: |
          if grep -rln -iE "#2E5C8A|#3E6D9E|#3A6E9E|#E3AAB8|#8A3A46|#1F2E3D" src/ tailwind.config.ts \
            --include="*.ts" --include="*.tsx" --include="*.css" \
            | grep -v "src/design/tokens.ts" | grep -v "src/app/tokens.css"; then
            echo "::error::Hex de marca fuera de src/design/tokens.ts (invariante E0-C5)"; exit 1
          fi
      - name: Privacidad — sin select(*) en páginas del cliente sobre quotes/orders
        run: |
          if grep -rn 'from("quotes")' src/app/\[locale\]/ -A2 | grep 'select("\*")'; then
            echo "::error::select(*) sobre quotes en página de cliente (invariante B.2.3)"; exit 1
          fi
          if grep -rn 'from("orders")' src/app/\[locale\]/ -A2 | grep 'select("\*")'; then
            echo "::error::select(*) sobre orders en página de cliente (invariante B.2.3)"; exit 1
          fi
      - name: Accesibilidad — sin regresiones de WCAG 2.1 AA en las 3 superficies (E6-C7)
        run: npm run audit:a11y
