# Auditoría 2026-08-06 — consolidación de jobs para reducir consumo de runners.
# Antes: cada cron era un job separado = 1 runner mínimo = 1 min facturado.
# Ahora: todos los crons de la misma frecuencia corren en 1 solo runner.
# Esto reduce ~70% el consumo de minutos del plan gratuito de GitHub.
#
# Requiere:
#  - CRON_SECRET en Secrets (mismo valor que en Vercel)
#  - CRON_BASE_URL en Variables (ej. "https://luluislandflagship.ca")

name: Critical Crons (sub-daily safety/financial)

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/15 * * * *"
    - cron: "0 * * * *"
  workflow_dispatch: {}

env:
  CURL_FLAGS: --retry 3 --retry-delay 2 --retry-all-errors -sf -o /dev/null -w "%{http_code}\n"

jobs:
  crons:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: critical-crons
      cancel-in-progress: false
    steps:
      - name: every-5-min — safety-abort-escalation
        if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl ${CURL_FLAGS} \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.CRON_BASE_URL }}/api/cron/safety-abort-escalation"

      - name: every-5-min — wellbeing-chemical-reassign
        if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl ${CURL_FLAGS} \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.CRON_BASE_URL }}/api/cron/wellbeing-chemical-reassign"

      - name: every-5-min — key-escalation-check
        if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl ${CURL_FLAGS} \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.CRON_BASE_URL }}/api/cron/key-escalation-check"

      - name: every-15-min — process-communication-events
        if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl ${CURL_FLAGS} \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.CRON_BASE_URL }}/api/cron/process-communication-events"

      - name: every-15-min — no-show
        if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl ${CURL_FLAGS} \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.CRON_BASE_URL }}/api/cron/no-show"

      - name: every-15-min — dispatch-scheduler
        if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl ${CURL_FLAGS} \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.CRON_BASE_URL }}/api/cron/dispatch-scheduler"

      - name: hourly — hold-authorize
        if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl ${CURL_FLAGS} \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.CRON_BASE_URL }}/api/cron/hold-authorize"

      - name: hourly — capture-remainder
        if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl ${CURL_FLAGS} \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.CRON_BASE_URL }}/api/cron/capture-remainder"

      - name: hourly — cash-exposure-monitor
        if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl ${CURL_FLAGS} \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.CRON_BASE_URL }}/api/cron/cash-exposure-monitor"

      - name: hourly — appeal-deadline-check
        if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl ${CURL_FLAGS} \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.CRON_BASE_URL }}/api/cron/appeal-deadline-check"

      - name: hourly — reconcile-payments
        if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl ${CURL_FLAGS} \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.CRON_BASE_URL }}/api/cron/reconcile-payments"
