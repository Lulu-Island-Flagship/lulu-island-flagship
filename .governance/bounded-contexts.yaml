# Mapa autoritativo bounded contexts → rutas (fuente: docs/PROTOCOLO-DESARROLLO.md §0.1)
# El gate UNCLASSIFIED (scripts/verify-invariants.mjs) clasifica cada archivo
# del diff contra estos patrones, EN ORDEN: el primer contexto que coincide
# gana. Semántica de patrones:
#   `*`   no cruza `/` (un segmento)
#   `**`  cruza `/` (cualquier profundidad)
#   `dir/**` cubre el directorio y todo su contenido
# Un archivo que no coincide con ningún patrón se trata como UNCLASSIFIED y
# BLOQUEA el gate hasta clasificarse. Nota: `src/lib/**` cae en `infra` como
# red de seguridad; al tocar un archivo nuevo de dinero/nómina/auth,
# clasifícalo explícitamente en su dominio.
